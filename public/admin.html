<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Create Zoom Meetings</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .form-container { max-width: 600px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        label, input, select { display: block; width: 100%; margin-bottom: 10px; padding: 10px; font-size: 16px; }
        button { padding: 15px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Create a Zoom Meeting</h2>
        <form id="meetingForm">
            <label for="date">Meeting Date:</label>
            <input type="date" id="date" name="date" required>
            
            <label for="startTime">Start Time:</label>
            <input type="time" id="startTime" name="startTime" required>

            <label for="meetingName">Meeting Name:</label>
            <input type="text" id="meetingName" name="meetingName" required>

            <label for="userList">User Emails (comma separated):</label>
            <input type="text" id="userList" name="userList" required>

            <label for="duration">Duration (minutes):</label>
            <input type="number" id="duration" name="duration" required>

            <label for="weekday">Day of the Week:</label>
            <select id="weekday" name="weekday" required>
                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
                <option value="Saturday">Saturday</option>
                <option value="Sunday">Sunday</option>
            </select>

            <label for="occurrences">Number of Occurrences:</label>
            <input type="number" id="occurrences" name="occurrences" required>

            <button type="submit">Create Meeting</button>
        </form>
    </div>

    <script>
        document.getElementById('meetingForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const meetingData = {
                date: document.getElementById('date').value,
                startTime: document.getElementById('startTime').value,
                meetingName: document.getElementById('meetingName').value,
                userList: document.getElementById('userList').value,
                duration: document.getElementById('duration').value,
                weekday: document.getElementById('weekday').value,
                occurrences: document.getElementById('occurrences').value
            };

            const response = await fetch('/create-meeting', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(meetingData)
            });

            const result = await response.json();
            if (response.ok) {
                alert('Meeting created successfully!');
            } else {
                alert('Error: ' + result.message);
            }
        });
    </script>
</body>
</html>
